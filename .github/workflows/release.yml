name: Release & Azure Trusted Signing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build, Sign & Publish Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CLI dependencies
        working-directory: strawberry-cli
        run: uv sync --locked

      - name: Run automated test suite
        working-directory: strawberry-cli
        run: uv run pytest -v

      - name: Install PyInstaller
        working-directory: strawberry-cli
        run: uv pip install pyinstaller

      - name: Build strawberry.exe with icon and PE version info
        working-directory: strawberry-cli
        run: |
          .\.venv\Scripts\pyinstaller.exe --onefile --name strawberry --paths src --icon ..\installer\strawberry.ico --version-file ..\installer\version_info.txt --clean src\strawberry_cli\main.py

      - name: Login to Azure (OIDC)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign standalone strawberry.exe via Azure Trusted Signing
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\strawberry-cli\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Stage public client config (.env.student)
        shell: pwsh
        env:
          PUB_URL: ${{ vars.STRAWBERRY_SUPABASE_URL }}
          PUB_KEY: ${{ vars.STRAWBERRY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (-not $env:PUB_URL -or -not $env:PUB_KEY) {
            throw "Missing repository variables STRAWBERRY_SUPABASE_URL or STRAWBERRY_SUPABASE_PUBLISHABLE_KEY."
          }
          @(
            "STRAWBERRY_SUPABASE_URL=$($env:PUB_URL)"
            "STRAWBERRY_SUPABASE_PUBLISHABLE_KEY=$($env:PUB_KEY)"
          ) | Set-Content -Path "installer\.env.student" -Encoding UTF8

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup check." }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Strawberry_Setup.exe
        shell: pwsh
        run: |
          & "$env:ISCC_EXE" "installer\strawberry.iss"
          Remove-Item "installer\.env.student" -Force -ErrorAction SilentlyContinue

      - name: Sign Strawberry_Setup.exe via Azure Trusted Signing
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-out" -Force | Out-Null
          Copy-Item "dist\Strawberry_Setup.exe" "release-out\Strawberry_Setup.exe"
          Copy-Item "strawberry-cli\dist\strawberry.exe" "release-out\strawberry.exe"
          Get-FileHash "release-out\Strawberry_Setup.exe", "release-out\strawberry.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Path "release-out\SHA256SUMS.txt" -Encoding UTF8
          Get-Content "release-out\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Strawberry ${{ inputs.tag || github.ref_name }}"
          files: |
            release-out\Strawberry_Setup.exe
            release-out\strawberry.exe
            release-out\SHA256SUMS.txt
          body: |
            ## Strawberry ${{ inputs.tag || github.ref_name }} (Windows x64)

            ### Downloads
            - **`Strawberry_Setup.exe`** — Per-user Windows installer (`PATH`, public `.env`, Windows Startup background sync daemon)
            - **`strawberry.exe`** — Standalone portable Windows executable
            - **`SHA256SUMS.txt`** — SHA-256 verification checksums
