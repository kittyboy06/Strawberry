name: Release & Code Sign

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CLI dependencies
        working-directory: strawberry-cli
        run: uv sync --locked

      - name: Run automated test suite
        working-directory: strawberry-cli
        run: uv run pytest -v

      - name: Install PyInstaller
        working-directory: strawberry-cli
        run: uv pip install pyinstaller

      - name: Build strawberry.exe with icon and PE version info
        working-directory: strawberry-cli
        run: |
          .\.venv\Scripts\pyinstaller.exe --onefile --name strawberry --paths src --icon ..\installer\strawberry.ico --version-file ..\installer\version_info.txt --clean src\strawberry_cli\main.py

      - name: Stage public client config (.env.student)
        shell: pwsh
        env:
          PUB_URL: ${{ vars.STRAWBERRY_SUPABASE_URL }}
          PUB_KEY: ${{ vars.STRAWBERRY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if (-not $env:PUB_URL -or -not $env:PUB_KEY) {
            throw "Missing repository variables STRAWBERRY_SUPABASE_URL or STRAWBERRY_SUPABASE_PUBLISHABLE_KEY."
          }
          @(
            "STRAWBERRY_SUPABASE_URL=$($env:PUB_URL)"
            "STRAWBERRY_SUPABASE_PUBLISHABLE_KEY=$($env:PUB_KEY)"
          ) | Set-Content -Path "installer\.env.student" -Encoding UTF8

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup check." }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Strawberry_Setup.exe
        shell: pwsh
        run: |
          & "$env:ISCC_EXE" "installer\strawberry.iss"
          Remove-Item "installer\.env.student" -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "release-unsigned" -Force | Out-Null
          Copy-Item "dist\Strawberry_Setup.exe" "release-unsigned\Strawberry_Setup.exe"
          Copy-Item "strawberry-cli\dist\strawberry.exe" "release-unsigned\strawberry.exe"

      - name: Upload unsigned build artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: strawberry-unsigned
          path: release-unsigned/*

    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}

  sign-and-release:
    name: Sign via SignPath & Publish Release
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit signing request to SignPath Foundation
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'strawberry' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed-release

      - name: Generate SHA-256 checksums
        run: |
          cd signed-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Strawberry ${{ inputs.tag || github.ref_name }}"
          files: |
            signed-release/*.exe
            signed-release/SHA256SUMS.txt
          body: |
            ## Strawberry ${{ inputs.tag || github.ref_name }} (Signed Windows x64 Release)

            Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by **SignPath Foundation**.

            ### Downloads
            - **`Strawberry_Setup.exe`** — Signed per-user Windows installer (`PATH`, public `.env`, Windows Startup background sync daemon)
            - **`strawberry.exe`** — Signed standalone portable Windows executable
            - **`SHA256SUMS.txt`** — Verification checksums
