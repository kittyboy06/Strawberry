name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-tests:
    name: Strawberry CLI (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: strawberry-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest suite
        run: uv run pytest -v

  admin-build:
    name: Strawberry Admin Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strawberry-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: strawberry-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript & Vite production build
        run: npm run build
