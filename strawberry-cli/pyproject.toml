[project]
name = "strawberry-cli"
version = "0.1.0"
description = "Standalone Windows CLI-Based Laboratory Program Retrieval System"
readme = "README.md"
authors = [
    { name = "Strawberry Team" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
strawberry = "strawberry_cli.main:main"
strawberry-cli = "strawberry_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
