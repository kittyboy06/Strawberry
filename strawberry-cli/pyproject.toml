[project]
name = "strawberry-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kittyboy06", email = "afsalahmed2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyperclip>=1.11.0",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
strawberry-cli = "strawberry_cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
]
